<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillsBridge Contact</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/contact.css">

</head>


<body>


<div class="container mt-5">


<div class="card shadow p-4">


<h2 class="text-center mb-4">
Contact SkillsBridge
</h2>



<div class="row">



<div class="col-md-6">


<h4>
Get In Touch
</h4>


<p>
📧 Email:
skillsbridge@gmail.com
</p>


<p>
📱 Mobile:
9876543210
</p>


<p>
📍 Location:
Nashik, Maharashtra
</p>


<p>
We are here to help you connect with mentors and improve your skills.
</p>


</div>




<div class="col-md-6">


<form>


<label>
Name
</label>

<input type="text"
class="form-control mb-3"
placeholder="Enter your name">



<label>
Email
</label>

<input type="email"
class="form-control mb-3"
placeholder="Enter your email">



<label>
Message
</label>

<textarea class="form-control mb-3"
rows="4"
placeholder="Write your message"></textarea>



<button type="button"
class="btn btn-primary w-100"
onclick="sendMessage()">

Send Message

</button>


</form>


</div>



</div>


</div>


</div>



<script>

function sendMessage(){

alert("Message Sent Successfully ✅");

}

</script>


</body>

</html>
