<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Skills | SkillBridge</title>

    <link rel="stylesheet" href="css/myskills.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>SkillBridge</h2>
        </div>

        <ul>
            <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

            <li><a href="findmentor.html"><i class="fa-solid fa-user-group"></i> Find Mentor</a></li>

            <li class="active"><a href="myskills.html"><i class="fa-solid fa-code"></i> My Skills</a></li>

            <li><a href="requests.html"><i class="fa-solid fa-paper-plane"></i> Requests</a></li>

            <li><a href="notifications.html"><i class="fa-solid fa-bell"></i> Notifications</a></li>

            <li><a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a></li>

            <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>

            <li><a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>

    </aside>

    <!-- Main -->
    <main class="main">

        <div class="topbar">
            <h1>My Skills</h1>

            <button id="addSkillBtn" class="add-btn">
                <i class="fa-solid fa-plus"></i>
                Add New Skill
            </button>
        </div>

        <!-- Skills Grid -->

        <div class="skills-grid">

            <div class="skill-card">
                <i class="fa-brands fa-html5"></i>
                <h3>HTML</h3>
                <p>Advanced</p>
                <button>Edit</button>
            </div>

            <div class="skill-card">
                <i class="fa-brands fa-css3-alt"></i>
                <h3>CSS</h3>
                <p>Advanced</p>
                <button>Edit</button>
            </div>

            <div class="skill-card">
                <i class="fa-brands fa-js"></i>
                <h3>JavaScript</h3>
                <p>Intermediate</p>
                <button>Edit</button>
            </div>

            <div class="skill-card">
                <i class="fa-brands fa-node-js"></i>
                <h3>Node.js</h3>
                <p>Intermediate</p>
                <button>Edit</button>
            </div>

            <div class="skill-card">
                <i class="fa-solid fa-database"></i>
                <h3>MongoDB</h3>
                <p>Intermediate</p>
                <button>Edit</button>
            </div>

            <div class="skill-card">
                <i class="fa-brands fa-python"></i>
                <h3>Python</h3>
                <p>Beginner</p>
                <button>Edit</button>
            </div>

        </div>

    </main>

</div>

<script src="js/myskills.js"></script>

</body>
</html>
